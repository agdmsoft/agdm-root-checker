<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050706">
<title>404 — Page Not Found | AGDM Root Checker</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="site.webmanifest">
<style>
.error-page {
  min-height: 80vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
}
.error-code {
  font-size: clamp(5rem, 15vw, 9rem);
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
  text-shadow: 0 0 40px rgba(255, 196, 0, 0.2);
  margin-bottom: 12px;
}
.error-title {
  font-size: clamp(1.5rem, 3vw, 2.2rem);
  font-weight: 700;
  color: var(--text);
  margin-bottom: 16px;
}
.error-desc {
  max-width: 520px;
  color: var(--muted);
  font-size: 1.05rem;
  line-height: 1.6;
  margin-bottom: 32px;
}
.error-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 12px 28px;
  border-radius: 999px;
  background: var(--accent);
  color: #000;
  font-weight: 700;
  font-size: 0.95rem;
  text-decoration: none;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.error-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 20px rgba(255, 196, 0, 0.4);
}
</style>
<meta name="robots" content="noindex,follow"></head>
<body>
<div class="container">
  <header style="margin: 30px 0;">
    <picture>
      <source srcset="logo.webp" type="image/webp">
      <img src="logo.png" alt="AGDM Logo" class="logo" width="74" height="74">
    </picture>
  </header>
  <main class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you are looking for does not exist or has been moved. Explore the AGDM Root Checker homepage or review our official documentation.</p>
    <a href="index.html" class="error-btn">Return to Home →</a>
  </main>
  <footer>
    <p>© 2026 AGDM Soft. All rights reserved.</p>
    <p>Contact us: support@agdmsoft.com</p>
  </footer>
</div>
</body>
</html>
